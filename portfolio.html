<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | GAEB 3D STUDIO</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        nav {
            width: 100%;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background: #0b0b0b;
            border-bottom: 1px solid rgba(120, 255, 0, 0.35);
            box-shadow: 0 2px 20px rgba(80, 255, 0, 0.12);
        }

        nav .logo {
            display: inline-block;
            padding: 8px 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #8cff00;
            border: 1px solid #8cff00;
            border-radius: 5px;

            text-shadow:
                0 0 5px #8cff00,
                0 0 12px rgba(140, 255, 0, 0.7),
                0 0 25px rgba(140, 255, 0, 0.4);

            box-shadow:
                0 0 5px rgba(140, 255, 0, 0.9),
                0 0 15px rgba(140, 255, 0, 0.6),
                inset 0 0 10px rgba(140, 255, 0, 0.15);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            position: relative;
            transition: color 0.25s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -8px;
            width: 0;
            height: 2px;
            background: #8cff00;
            box-shadow: 0 0 8px rgba(140, 255, 0, 0.7);
            transform: translateX(-50%);
            transition: width 0.25s ease;
        }

        nav a:hover {
            color: #8cff00;
        }

        nav a:hover::after {
            width: 100%;
        }

        .portfolio {
            padding: 150px 7% 120px;
            min-height: 100vh;
        }

        .section-title {
            font-size: 48px;
            margin-bottom: 60px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
            width: 100%;
        }

        .gallery-item {
            display: block;
            border: 1px solid #8cff00;
            overflow: hidden;
            background: #111;
            transition: all 0.3s ease;
        }
       .gallery-category {
    margin-top: 60px;
    margin-bottom: 25px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #8cff00;
    text-align: center;
}
        .blender-category {
    margin-top: 100px;
}
        .blender-category::after {
    content: "";
    display: block;
    width: 60px;
    height: 2px;
    background: #8cff00;
    margin: 15px auto 0;
    box-shadow: 0 0 8px rgba(140, 255, 0, 0.5);
}

        .gallery-item img {
            width: 100%;
            height: 550px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover {
            box-shadow:
                0 0 10px rgba(140, 255, 0, 0.5),
                0 0 30px rgba(140, 255, 0, 0.2);
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .back-button {
            display: inline-block;
            margin-top: 50px;
            padding: 15px 30px;
            background: #0b0b0b;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #8cff00;

            box-shadow:
                0 0 8px rgba(140, 255, 0, 0.7),
                0 0 20px rgba(140, 255, 0, 0.25);

            transition: all 0.25s ease;
        }

        .back-button:hover {
            background: #8cff00;
            color: #0b0b0b;
            transform: translateY(-2px);
        }
        .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.95);
    align-items: center;
    justify-content: center;
}

.lightbox img {
    max-width: 85vw;
    max-height: 85vh;
    object-fit: contain;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
    position: absolute;
    border: none;
    background: none;
    color: white;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: color 0.2s ease;
}

.lightbox-close {
    top: 25px;
    right: 35px;
    font-size: 45px;
}

.lightbox-prev {
    left: 30px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 60px;
}

.lightbox-next {
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 60px;
}

.lightbox-close:hover,
.lightbox-prev:hover,
.lightbox-next:hover {
    color: #8cff00;
}

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
                padding: 12px 3%;
            }

            nav ul {
                gap: 12px;
                justify-content: center;
                width: 100%;
            }

            nav ul a {
                font-size: 11px;
            }

            .portfolio {
                padding: 130px 7% 80px;
            }

            .section-title {
                font-size: 36px;
                margin-bottom: 35px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .gallery-item img {
                height: 300px;
            }

        }
 .gallery-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;

            letter-spacing: 6px;
            color: white;
            text-align: center;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 10px;
        }
    </style>
    
</head>

<div class="lightbox" id="lightbox">

    <button class="lightbox-close" id="lightbox-close">×</button>

    <button class="lightbox-prev" id="lightbox-prev">‹</button>

    <img id="lightbox-image" src="" alt="">

    <button class="lightbox-next" id="lightbox-next">›</button>

</div>
    <script>

    const galleryItems = document.querySelectorAll(".gallery-item");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const closeButton = document.getElementById("lightbox-close");
    const prevButton = document.getElementById("lightbox-prev");
    const nextButton = document.getElementById("lightbox-next");

    let currentImage = 0;

    const images = Array.from(galleryItems).map(item => {
        return item.querySelector("img").src;
    });

    function showImage(index) {
        currentImage = (index + images.length) % images.length;
        lightboxImage.src = images[currentImage];
        lightbox.style.display = "flex";
    }

    galleryItems.forEach((item, index) => {
        item.addEventListener("click", function(event) {
            event.preventDefault();
            showImage(index);
        });
    });

    closeButton.addEventListener("click", function() {
        lightbox.style.display = "none";
    });

    nextButton.addEventListener("click", function() {
        showImage(currentImage + 1);
    });

    prevButton.addEventListener("click", function() {
        showImage(currentImage - 1);
    });

    lightbox.addEventListener("click", function(event) {
        if (event.target === lightbox) {
            lightbox.style.display = "none";
        }
    });

    document.addEventListener("keydown", function(event) {

        if (lightbox.style.display !== "flex") return;

        if (event.key === "Escape") {
            lightbox.style.display = "none";
        }

        if (event.key === "ArrowRight") {
            showImage(currentImage + 1);
        }

        if (event.key === "ArrowLeft") {
            showImage(currentImage - 1);
        }

    });

</script>
